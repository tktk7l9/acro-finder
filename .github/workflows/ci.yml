name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs here.
      # Dependabot (github-actions ecosystem) keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for gitleaks-action to scan the commit range
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      # In Next 16, next build does not run lint. Without this step lint runs
      # nowhere, so run it here (ai-primer / service-anatomy do not have it
      # yet; they have the same gap).
      - run: npm run lint
      # lib/csp.test.ts is the only thing stopping 'strict-dynamic' from creeping back in.
      # Under CSP Level 3, 'strict-dynamic' makes both 'self' and 'unsafe-inline'
      # ignored, and with no nonce or hash in this setup every script on the page stops.
      # The symptom only shows after the production deploy, so stop it here.
      - run: npm run test:cov
      - run: npm run build
